<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DockNotes 🐳</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #333;
    }

    input {
      padding: 10px;
      width: 250px;
      margin-right: 10px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }

    .note {
      background: white;
      padding: 10px;
      margin: 10px auto;
      width: 300px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <h1>🐳 DockNotes</h1>

  <input type="text" id="noteInput" placeholder="Enter note..." />
  <button onclick="addNote()">Add</button>

  <div id="notes"></div>

  <script>
    const API = "http://localhost:5000/notes";

    async function loadNotes() {
      const res = await fetch(API);
      const data = await res.json();

      const notesDiv = document.getElementById("notes");
      notesDiv.innerHTML = "";

      data.forEach(note => {
        const div = document.createElement("div");
        div.className = "note";
        div.innerHTML = `
          <span>${note.text}</span>
          <button onclick="deleteNote('${note._id}')">❌</button>
        `;
        notesDiv.appendChild(div);
      });
    }

    async function addNote() {
      const input = document.getElementById("noteInput");
      const text = input.value;

      if (!text) return;

      await fetch(API, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ text })
      });

      input.value = "";
      loadNotes();
    }

    async function deleteNote(id) {
      await fetch(`${API}/${id}`, {
        method: "DELETE"
      });

      loadNotes();
    }

    loadNotes();
  </script>

</body>
</html>
